# The software profile: five levels, from the first deploying project's shape, under generic names.
# Kind letters are unique across the spec. "L" is reserved for level prefixes
# (L0-, L1-, ...) and may not be a kind.
name: software
free-kinds: # allowed at any level; the level comes from the path; a written L<n>- prefix is checked
  V: verification # guards, tests, verification doctrine
  A: assumption # a world-fact this level's items rely on
  X: limitation # an accepted gap or carried defect
  H: hazard # a named risk with a measurement
  E: evaluation criterion
  Q: open question # proposed until an answer item supersedes it; items waiting on it say depends-on
levels:
  - n: 0
    name: purpose
    kinds:
      G: goal
      C: constraint # pass/fail; never traded for goal progress
      R: requirement # numbered requirements, kept verbatim from the project's requirements document
    sections:
      - Mission
      - Goals
      - Constraints
      - Requirements
      - Environment:
          - Assumptions
          - External constraints
      - Users and operators
      - Limitations
      - Risks:
          - Hazards
          - Safety constraints
          - Security threats
      - Evaluation criteria and priorities
      - Verification
  - n: 1
    name: principles
    kinds:
      P: principle
    sections:
      - Principles
      - Budgets
      - Never-list
      - Verification
  - n: 2
    name: architecture
    kinds:
      D: design element # charters, doctrines, components, interfaces, behaviors
    sections:
      - Components
      - Interfaces
      - Behaviors
      - Charters and doctrines
      - Environment models
      - Operator tasks
      - Verification
  - n: 3
    name: specs
    kinds:
      S: spec # rulings, detailed specs, ADRs, acceptance criteria
    sections:
      - Rulings
      - Specs
      - Decisions
      - Acceptance criteria
      - Verification
  - n: 4
    name: realization
    kinds:
      I: implementation # code pointers
    sections:
      - Code
      - Guards
      - Tests
      - Operations
